  # ---------- НДС для плательщиков на УСН ----------

  - id: nds_declaration
    title: "Декларация по НДС за квартал"
    category: reports
    date_rule: { type: quarterly, offset_month: 1, day: 25 }
    shift: next_workday
    applies_if:
      regime: [usn6, usn15]
      nds_payer: true
    needs_prep: true
    norm: "НК РФ, ст. 174, п. 5"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_28165/cf8ce1f96c094ce8316b91e3ee5831f20a57a4a8/"
    howto_steps:
      - "Соберите счета-фактуры, выставленные за квартал, и сформируйте книгу продаж."
      - "Заполните декларацию по НДС в бухгалтерии банка или у оператора электронного документооборота и подпишите электронной подписью."
      - "Отправьте декларацию только в электронном виде — до {due_date}. Бумажная не считается поданной."
    howto_link: { label: "НДС при УСН на сайте ФНС", url: "https://www.nalog.gov.ru/rn77/taxation/taxes/nds_usn/" }
    penalty_text: "Штраф 5% от неуплаченного НДС за каждый месяц просрочки (не меньше 1 000 ₽), после 20 дней — могут заблокировать счёт."
    rule_version: 1
    last_checked_at: "2026-09-24"

