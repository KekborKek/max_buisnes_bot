      - "Заполните уведомление в кабинете ИП: налог по УСН, код периода 34/03, сумма аванса."
      - "Подпишите и отправьте уведомление — до {due_date}."
    howto_link: { label: "Открыть кабинет ИП", url: "https://lkip2.nalog.ru/lk" }
    penalty_text: "Без уведомления деньги на едином счёте не засчитаются в аванс — пойдут пени. За неподанное уведомление — штраф 200 ₽."
    rule_version: 1
    last_checked_at: "2026-09-24"

