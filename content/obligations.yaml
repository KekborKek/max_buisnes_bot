# Справочник обязательств ИП для «Календаря обязательств».
# Профили: УСН 6% и 15% (отдельные записи, D17), патент, АУСН; с 29.09 — и сроки работодателя (has_employees: true)
# + блок НДС для тех, кто превысил порог из content/nds.yaml.
#
# Нормы — НК РФ в редакции на сентябрь 2026 года:
#   ст. 346.21 п. 7 — авансы по УСН до 28-го числа месяца после квартала, налог ИП за год — до 28 апреля;
#   ст. 346.23 п. 1 пп. 2 — декларация по УСН для ИП — до 25 апреля;
#   ст. 58 п. 9 — уведомление об исчисленных суммах — до 25-го числа месяца срока уплаты;
#     за год уведомление не подаётся: сумму налоговая берёт из декларации;
#     по фиксированным взносам и 1% уведомление ИП не подаёт;
#   ст. 432 п. 2 — фиксированные взносы — до 28 декабря, 1% с дохода свыше 300 тыс. ₽ — до 1 июля;
#   ст. 174 п. 1 и п. 5 — НДС: декларация до 25-го числа месяца после квартала (только электронно),
#     уплата равными долями до 28-го числа каждого из трёх месяцев после квартала;
#   ст. 6.1 п. 7 — срок, выпавший на выходной или нерабочий праздничный день, переносится
#     на ближайший рабочий день. Поэтому у всех записей shift: next_workday.
#
# Правило: сумм в рублях здесь нет — они меняются каждый год. Шаги отправляют смотреть сумму на сайт ФНС.

