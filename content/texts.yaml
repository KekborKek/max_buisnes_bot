# Все тексты, которые видит пользователь. Правит UX/UI (участник A) без изменения кода.
# Подстановки: {name}. Разметка markdown MAX: **жирный**, _курсив_.

common:
  wait: "Секунду, собираю ваш календарь…"
  error: "Не получилось. Проверьте интернет и нажмите «Повторить»."
  btn_retry: "Повторить"

start:
  greeting: "Здравствуйте. Я собираю обязательные сроки ИП — налоги, взносы, отчёты — и напоминаю о них заранее. С 2026 года ИП на упрощёнке платят НДС, если доход за прошлый год выше {nds_limit}. Проверим за минуту, касается ли это вас, и соберём ваш календарь."
  btn_check: "Проверить НДС"
  btn_about: "О сервисе"
  already_built: "Ваш календарь уже собран."
  btn_open: "Открыть календарь"
  btn_rebuild: "Собрать заново"
  # Порог НДС в миллионах: «20 млн ₽», «2,4 млн ₽». Перед ₽ — неразрывный пробел.
  nds_limit: "{value} млн ₽"

onboarding:
  q1: "Вопрос 1 из 4. Какой доход был за {income_year} год?"  # D2; income_year = текущий год − 1
  q1_lt10: "До 10 млн ₽"
  q1_10_20: "10–20 млн ₽"
  q1_20_60: "20–60 млн ₽"
  q1_gt60: "Больше 60 млн ₽"
  q2: "Вопрос 2 из 4. На каком вы режиме?"
  q2_usn6: "УСН 6%"
  q2_usn15: "УСН 15%"
  q2_patent: "Патент"
  q2_ausn: "АУСН"
  q3: "Вопрос 3 из 4. Есть ли у вас сотрудники?"
  q3_no: "Работаю сам"
  q3_yes: "Есть сотрудники"
  q4: "Вопрос 4 из 4. Ваш часовой пояс — московский? Напоминания буду присылать в 10:00 по нему."
  q4_msk: "Москва, UTC+3"
  q4_other: "Другой пояс"
  q4_list: "Выберите часовой пояс:"
  btn_unknown: "Не знаю"
  btn_back: "Назад"
  use_buttons: "Выберите один из вариантов ниже."
  # Подписи кнопок «Другой пояс» (D3); ключ — IANA-идентификатор, он же значение кнопки.
  tz:
    Europe/Kaliningrad: "Калининград (UTC+2)"
    Europe/Samara: "Самара (UTC+4)"
    Asia/Yekaterinburg: "Екатеринбург (UTC+5)"
    Asia/Omsk: "Омск (UTC+6)"
    Asia/Krasnoyarsk: "Красноярск (UTC+7)"
    Asia/Irkutsk: "Иркутск (UTC+8)"
    Asia/Yakutsk: "Якутск (UTC+9)"
    Asia/Vladivostok: "Владивосток (UTC+10)"
    Asia/Magadan: "Магадан (UTC+11)"
    Asia/Kamchatka: "Камчатка (UTC+12)"

disclaimer:
  profile: "Профиль заполняете вы. Мы не запрашиваем ИНН и не сверяем данные с ФНС."
  mark: "Вы отметили обязательство выполненным. Продукт не проверяет факт оплаты или отправки отчётности."

# Экран 3 «Ответ про НДС» (docs/screens/03-nds-answer.md). Порог и годы — из content/nds.yaml.
nds:
  not_payer: "По вашему доходу НДС платить не нужно: порог — {limit}. Закон № 228-ФЗ закрепил его для доходов за {years} годы. Соберу ваш календарь — увидите все сроки сразу."
  payer: "При доходе выше {limit} вы платите НДС. Это четыре срока в квартал: декларация до 25-го числа и платёж равными долями до 28-го. Ближайшее: {next_title} — до {next_date}{shift_note}. Соберу календарь и напомню за 30, 7 и 1 день."
  unknown: "Считаю, что доход ниже {limit} и НДС платить не нужно. Если это не так, поменяете в профиле. Соберу ваш календарь."
  special_regime: "На режиме «{regime_name}» НДС по основной деятельности не платится. Соберу календарь по вашим остальным срокам."
  regime_guessed: "Режим поставил «УСН 6%» — самый частый. Если у вас другой, поменяете в профиле."
  shift_note: " ({original_date} — выходной)"
  btn_build: "Собрать календарь"
  btn_why: "Почему так?"
  # Текст #106 (человек, дословно): «Порог дохода для освобождения от НДС на УСН:
  # 20 млн ₽ — за 2025–2028 годы; 15 млн ₽ — за 2029 год; 10 млн ₽ — за 2030 год и
  # последующие годы. Основание: Федеральный закон от 04.07.2026 № 228-ФЗ.»
  # {thresholds} собирается в nds_answer.thresholds_text() из threshold_first/_range/
  # _single (разделитель «; ») с threshold_last_suffix у последнего порога.
  why: "Порог дохода для освобождения от НДС на УСН: {thresholds}. Основание: {law}."
  btn_law: "Закон"
  btn_fns: "Разъяснения ФНС"
  years_range: "{first}–{last}"
  threshold_first: "{limit} — за {years} годы"
  threshold_range: "{limit} — за {years} годы"
  threshold_single: "{limit} — за {year} год"
  threshold_last_suffix: " и последующие годы"

# Экран 5 «Календарь готов» (docs/screens/05-calendar-ready.md).
calendar_ready:
  body: "Готово. Добавил {count} {count_word} до конца года. Ближайшее — {next_date}: {next_title}. Напомню за 30, 7 и 1 день — в 10:00 по вашему часовому поясу. Свои задачи тоже можно вести здесь — просто напишите их мне."
  empty: "По вашему профилю обязательных сроков до конца года нет. Добавьте свою задачу — напишите мне о ней."
  no_employee_items: "События по сотрудникам пока не собираю — только ваши собственные сроки."  # D16, текст правит UX
  btn_open: "Открыть календарь"
  btn_settings: "Настройки"  # показывается, когда готов экран 13
  # {count_word}: 1, 21 — one; 2–4, 22–24 — few; остальное — many.
  count_one: "событие"
  count_few: "события"
  count_many: "событий"

# Экран 9 «Своя задача текстом» (docs/screens/09-task-from-chat.md).
task:
  # {time} — «10:00», «9:05», «15:30» (#103)
  confirm: "Задача: «{title}». Срок — {date}, напомню {remind_when} в {time}. Сохранить?"
  # confirm, когда напоминания не будет: задача на сегодня или на завтра после 10:00 (#87)
  confirm_no_remind: "Задача: «{title}». Срок — {date}. Сохранить?"  # временный текст техлида, ждёт UX
  saved: "Добавил. Всего в календаре {count} {count_word}."  # {count_word} — calendar_ready.count_*
  past_date: "{date} уже прошло. Сохранить на {next_year_date}?"
  duplicate: "Такая задача уже есть на {date}."
  cancelled: "Хорошо, не сохраняю."
  # кнопка из сообщения с прежним черновиком, после него пришёл новый (#87)
  draft_stale: "Эта задача уже не актуальна. Сохраните последнюю или пришлите задачу ещё раз."  # временный текст техлида, ждёт UX
  remind_day: "за день"  # {remind_when} по умолчанию (экран 9)
  remind_same_day: "в день срока"  # {remind_when}, когда время есть в сообщении (#103) — временный текст техлида, ждёт UX
  empty_title: "TODO"  # в сообщении только дата, названия нет — текста в спеке нет
  btn_save: "Сохранить"
  btn_edit: "Изменить"  # D12
  btn_cancel: "Отмена"
  btn_add_anyway: "Добавить всё равно"
  btn_yes: "Да"
  btn_open: "Открыть календарь"

# Экран 10 «Бот не понял или сервис не работает» (docs/screens/10-fallback.md).
fallback:
  unknown: "Я понимаю сроки и задачи. Напишите, например: «оплатить аренду 5 ноября»."
  no_date: "Понял задачу «{title}», но не увидел дату. Когда напомнить?"
  service: "Не получилось. Проверьте интернет и нажмите «Повторить». Ваши данные на месте."
  unknown_3: "Если нужного нет в календаре, напишите нам."
  service_2: "Сервис временно недоступен. Напоминания придут в срок, календарь не потерян."
  btn_open: "Открыть календарь"
  btn_about: "О сервисе"
  btn_tomorrow: "Завтра"
  btn_week: "Через неделю"
  btn_pick: "Выбрать дату"
  btn_retry: "Повторить"
  btn_write: "Написать нам"

about:
  body: "Я календарь обязательных сроков для ИП: налоги, взносы, отчёты и ваши собственные задачи. Сроки беру из налогового и производственного календарей; у каждого события есть основание и дата сверки — последняя {last_checked}. Суммы не считаю и консультаций не даю. Отметка выполнения ваша: факт оплаты или отправки отчётности я не проверяю. Храню только ваши ответы: доход, режим, сотрудники и часовой пояс. ИНН не спрашиваю, доступа к счёту и кабинету ФНС у меня нет."
  # Справочник недоступен (поправка планировщика к issue #54, docs/screens/11-about.md «Состояния»):
  # тот же текст, но без даты сверки — фраза "и дата сверки — последняя {last_checked}" опущена,
  # остальное дословно как в body.
  body_no_reference: "Я календарь обязательных сроков для ИП: налоги, взносы, отчёты и ваши собственные задачи. Сроки беру из налогового и производственного календарей; у каждого события есть основание. Суммы не считаю и консультаций не даю. Отметка выполнения ваша: факт оплаты или отправки отчётности я не проверяю. Храню только ваши ответы: доход, режим, сотрудники и часовой пояс. ИНН не спрашиваю, доступа к счёту и кабинету ФНС у меня нет."
  privacy: "Как мы обрабатываем данные: {privacy_url}"
  btn_check: "Проверить НДС"
  btn_open: "Открыть календарь"
  btn_write: "Написать нам"

# Экран 6. Напоминания. Логика — docs/spec/reminders.md.
reminder:
  d30: "Через месяц, {date} — {title}. К этому сроку нужно подготовиться — предупреждаю заранее."
  d7: "Через 7 дней, {date} — {title}. Если опоздать: {penalty}"
  d1: "Завтра, {date} — {title}. Это последний день срока."
  overdue: "Срок {date} прошёл, отметки нет: {title}. Если вы уже всё сделали — отметьте, и я перестану считать его просроченным."
  snooze: "Напоминаю: {date} — {title}."
  task: "{when}, {date} — {title}."
  grouped: "{when}, {date} — {count_words}: {titles}. Откройте календарь — там подробности и отметки."
  shift_note: " (перенос с {original_date}, выходной)"
  snooze_ok: "Хорошо, напомню завтра в {hour}:00."
  btn_done: "Отметить выполненным"
  btn_howto: "Как сделать"
  btn_snooze: "Напомнить завтра"
  btn_open: "Открыть календарь"
  # Слова для {when} и {count_words}: «Сегодня» / «Завтра» / «Через месяц» / «Через N дней»;
  # «два срока», «три срока». Форму слова после числа выбирает app/bot/formatting.py:
  # _one — 1, 21, 31…; _few — 2–4, 22–24…; _many — остальное.
  when_today: "Сегодня"
  when_tomorrow: "Завтра"
  when_month: "Через месяц"
  when_days: "Через {n} {unit}"
  day_one: "день"
  day_few: "дня"
  day_many: "дней"
  count_2: "два срока"
  count_3: "три срока"
  count_4: "четыре срока"
  count_n: "{n} {unit}"
  term_one: "срок"
  term_few: "срока"
  term_many: "сроков"
  # Названия в {titles}: «А и Б», «А, Б и В».
  titles_sep: ", "
  titles_last_sep: " и "

# Экран 12 «Сводка в понедельник» (docs/screens/should-12-13-19.md; T14, #77). Приходит, только
# если на неделе есть события. {range} — неделя пн–вс; {count_words} — reminder.count_* /
# count_n с заглавной буквы (app/calendar/digest.py); {items} — пункты digest.item через items_sep.
digest:
  body: "Неделя {range}. {count_words}: {items}."
  btn_open: "Открыть календарь"
  btn_off: "Без сводки"
  off_ok: "Хорошо, сводку больше не присылаю."
  # Пункт и разделитель — из примера экрана 12: «28 октября — аванс по УСН; 30 октября — …».
  item: "{date} — {title}"
  items_sep: "; "

# Экран 7 «Как сделать» (docs/screens/07-howto.md). Длиннее 4 строк — исключение D4.
# Последняя строка body — disclaimer.not_advice, встроенный в текст.
howto:
  body: |-
    **{title}**, до {date}.

    1. {step1}
    2. {step2}
    3. {step3}

    Основание: {norm}. Сверено {last_checked}. Суммы не считаем, это не налоговая консультация.
  no_steps: "По этому событию у меня пока нет порядка действий. Срок — {date}, основание — {norm}."
  btn_done: "Отметить выполненным"
  btn_wrong: "Неверный срок"
  wrong_thanks: "Спасибо, проверим и исправим. Вашу отметку записал."
  # Кнопка-ссылка на source_url в состоянии no_steps: подписи в спеке нет, текст даёт UX.
  btn_source: "TODO"

# Экран 8 «Отметить выполненным» (docs/screens/08-done.md). {disclaimer} — disclaimer.mark.
done:
  body: "Отметил: {title} — выполнено.\n{disclaimer}\nСледующее — {next_date}: {next_title}."
  last_in_year: "Отметил: {title} — выполнено.\n{disclaimer}\nЭто было последнее обязательное событие в {year} году. Следующее — {next_date}: {next_title}."
  nothing_next: "Отметил: {title} — выполнено.\n{disclaimer}\nБольше сроков в календаре нет."
  already: "Это событие уже отмечено {done_date}."
  undone: "Отменил выполнение. Напомню, как планировал."
  btn_open: "Открыть календарь"
  btn_undo: "Отменить выполнение"

# Служебная команда /demo_remind для админов (docs/spec/reminders.md, «Демо»; T13b, #72).
# Эти тексты видят только user_id из ADMIN_IDS, не обычные пользователи.
demo:
  usage: "Формат: /demo_remind <вид>. Доступные виды: {kinds}."
  no_items: "Невыполненных обязательств нет — показать нечего. Соберите календарь или отметьте что-то как невыполненное."
  # /demo_remind digest, на текущей неделе нет событий без отметки. Текста в спеке нет (#77).
  digest_empty: "TODO"

# Экран 3, «Лимит режима» (#107, docs/screens/03-nds-answer.md). ВРЕМЕННЫЕ тексты техлида —
# в спеке их нет, UX правит. Лимит, норма, шаги и ссылки — из content/regime_limits.yaml.
# {income} — подпись ответа на вопрос 1 со строчной буквы, {regime_name} — подпись режима.
regime_limit:
  warning: "Вы указали доход за {income_year} год: {income}. Для режима «{regime_name}» лимит — {limit}, при превышении право на режим теряется. Посмотрите, что обычно нужно сделать."
  btn_howto: "Что делать"
  howto: |-
    **Если доход выше лимита режима «{regime_name}»**

    {steps}

    Основание: {norm}. Сверено {last_checked}. {not_advice}
  step: "{number}. {text}"
  # Смысл disclaimer.not_advice, формулировка — как в howto.body экрана 7.
  not_advice: "Суммы не считаем, это не налоговая консультация."
  btn_law: "Закон"
  btn_fns: "Разъяснения ФНС"

# «Написать нам» — обращение в боте (экраны 10 и 11, D13; handlers/feedback.py).
# Временный текст техлида (28.09), ждёт UX.
# forward, author*, list_* видят только админы (ADMIN_IDS), не пользователи.
feedback:
  prompt: "Напишите сообщение одним текстом, я передам его команде сервиса. Например, чего не хватает в календаре или что работает не так."
  btn_cancel: "Отмена"
  sent: "Спасибо, передал команде."
  cancelled: "Хорошо, ничего не отправляю."
  empty: "Нужен текст одним сообщением. Напишите, что передать команде, или нажмите «Отмена»."
  too_long: "Длина — {length}, максимум — {limit} символов. Сократите, пожалуйста."
  # Больше 5 обращений за час от одного пользователя (feedback.RATE_LIMIT).
  rate_limited: "Вы уже написали нам несколько раз за час — мы всё прочитаем. Попробуйте позже."
  forward: "Обращение #{id} от {author}:\n{text}"
  author: "{name}, id {user_id}"
  author_id: "id {user_id}"
  list_empty: "Обращений пока нет."
  list_title: "Последние обращения, {count}:"
  list_item: "#{id} · {when} · {author}{status}: {text}"
  list_not_forwarded: " · не переслано"
