  when_today: "Сегодня"
  when_tomorrow: "Завтра"
  when_month: "Через месяц"
  when_days: "Через {n} {unit}"
  day_one: "день"
  day_few: "дня"
  day_many: "дней"
  count_2: "два срока"
  count_3: "три срока"
  count_4: "четыре срока"
  count_n: "{n} {unit}"
  term_one: "срок"
  term_few: "срока"
  term_many: "сроков"
  # Названия в {titles}: «А и Б», «А, Б и В».
  titles_sep: ", "
