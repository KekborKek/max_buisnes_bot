# Пороги освобождения от НДС для УСН — п. 1 ст. 145 НК РФ в редакции Федерального закона
# от 04.07.2026 № 228-ФЗ. Текст закона: «20 миллионов рублей за 2025 - 2028 годы,
# 15 миллионов рублей за 2029 год, 10 миллионов рублей за 2030 год».
# income_years — год, за который считается доход; порог действует в следующем году.
# В законе 10 млн ₽ — «за 2030 год», дальнейшие годы отдельно не названы, но порог
# остаётся 10 млн и для них (#106). В thresholds записи для 2031+ нет — nds_limit_for
# (backend/app/calendar/dates.py) и threshold_years (nds_answer.py) для года дохода
# позже последнего здесь возвращают порог последней записи, а не «порога нет».
law: "Федеральный закон от 04.07.2026 № 228-ФЗ"
law_url: "http://publication.pravo.gov.ru/document/0001202607040017"
fns_guide_url: "https://www.nalog.gov.ru/rn77/taxation/taxes/nds_usn/"
thresholds:
  - { income_years: [2025, 2026, 2027, 2028], limit_rub: 20000000 }
  - { income_years: [2029], limit_rub: 15000000 }
  - { income_years: [2030], limit_rub: 10000000 }
last_checked_at: "2026-09-24"
