# Производственный календарь РФ: отличия от «суббота и воскресенье — выходные».
# holidays — нерабочие праздничные дни и дни отдыха, выпавшие на пн–пт
#            (ст. 112 ТК РФ + переносы по постановлениям Правительства);
# workdays — субботы и воскресенья, ставшие рабочими из-за переноса.
#
# 2026 — постановление Правительства РФ от 24.09.2025 № 1466 «О переносе выходных дней в 2026 году»:
#   сб 3 января → пт 9 января, вс 4 января → чт 31 декабря.
#   Праздники на выходных: 8 марта (вс) → пн 9 марта, 9 мая (сб) → пн 11 мая (ч. 2 ст. 112 ТК РФ).
#   Итог: 247 рабочих дней — сходится с календарём КонсультантПлюс.
# 2027 — постановление Правительства РФ от 17.09.2026 № 1187 «О переносе выходных дней в 2027 году»:
#   сб 2 января → пт 5 ноября, вс 3 января → пт 31 декабря, сб 20 февраля → пн 22 февраля
#   (20 февраля — рабочая суббота).
#   Праздники на выходных: 1 мая (сб) → пн 3 мая, 9 мая (вс) → пн 10 мая, 12 июня (сб) → пн 14 июня.
#   Итог: 247 рабочих дней — сходится с календарём КонсультантПлюс.
# 2028 — постановление ещё не опубликовано (обычно выходит в сентябре предыдущего года).
#   Сроков, которые из декабря 2027 уходили бы в 2028, в справочнике нет: 28.12.2027 — вторник.
#
# Источники: https://www.consultant.ru/document/cons_doc_LAW_515170/
#            https://www.consultant.ru/law/ref/calendar/proizvodstvennye/2026/
#            https://www.consultant.ru/law/ref/calendar/proizvodstvennye/2027/
