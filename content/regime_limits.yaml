# Лимиты доходов спецрежимов и порядок действий при превышении (#107, экран 3, «Лимит режима»).
# Сверено 27.09.2026 по первоисточникам: база «Гарант» (тексты норм с историей изменений),
# nalog.gov.ru, publication.pravo.gov.ru. consultant.ru в день сверки был недоступен.
#
# limits: доход за год из income_years (или за любой год начиная с income_years_from)
# сравнивается с limit_rub. Для патента это «доходы за предшествующий год» из п. 6 ст. 346.45
# НК РФ, для АУСН — «доходы за календарный год, предшествующий году перехода» (п. 23 ч. 2 ст. 3
# закона № 17-ФЗ); в обоих случаях лимит действует и для доходов с начала текущего года.
# Бот спрашивает доход за прошлый год (D2) — именно его и сравниваем.
# verified: false — факт не подтверждён первоисточником, его сверяет аналитик.
# Шаги — «что обычно делают», не консультация; формулировки шагов и форму 26.5-3 сверяет аналитик.
last_checked_at: "2026-09-27"
regimes:
  patent:
    # Пп. 1 п. 6 ст. 346.45 НК РФ изменён с 01.01.2026 законом № 425-ФЗ от 28.11.2025:
    # «...за 2025 год или в течение 2026 года превысили 20 миллионов рублей»,
    # «...за 2026 год или в течение 2027 года превысили 15 миллионов рублей»,
    # общее правило — «...превысили 10 миллионов рублей» (ФНС: «справочно: 2028 г. и последующие годы»).
    # Закон № 228-ФЗ от 04.07.2026 меняет только ст. 145 НК РФ (НДС), патент не затрагивает.
    norm: "п. 6 и 8 ст. 346.45 НК РФ (в ред. Федерального закона № 425-ФЗ от 28.11.2025)"
    norm_url: "https://base.garant.ru/10900200/8da055adfdbeb67a44e7419caf3bf35c/"
    fns_url: "https://www.nalog.gov.ru/rn77/taxation/taxes/patent/"
    limits:
      - { income_years: [2025], limit_rub: 20000000, verified: true }
      # Аналитику: сверить 15 млн за 2026 год на consultant.ru (сверено по «Гаранту» и ФНС).
      - { income_years: [2026], limit_rub: 15000000, verified: true }
      - { income_years_from: 2027, limit_rub: 10000000, verified: true }
    steps:
      - text: "Обычно подают в налоговую заявление об утрате права на патент — в течение 10 календарных дней со дня, когда доход превысил лимит."
        norm: "п. 8 ст. 346.45 НК РФ; форма заявления 26.5-3 — приказ ФНС России от 26.12.2025 № ЕД-7-3/1275@"
        verified: true
      - text: "Обычно с начала срока патента ИП переходит на общий режим, а на УСН или ЕСХН — если применяли. При совмещении патента и УСН доходы по ним складываются."
        norm: "п. 6 ст. 346.45 НК РФ"
        verified: true
      - text: "Налоги за этот период обычно платят как новый ИП, без пеней за это время, и уменьшают на то, что уже уплачено за патент."
        norm: "п. 7 ст. 346.45 НК РФ"
        verified: true
      - text: "Вернуться на патент по этому виду деятельности обычно можно не раньше следующего календарного года."
        norm: "п. 8 ст. 346.45 НК РФ"
        verified: true
  ausn:
    # Закон № 17-ФЗ от 25.02.2022: п. 23 ч. 2 ст. 3 (ред. № 259-ФЗ от 08.08.2024) — «совокупный
    # размер доходов за календарный год, предшествующий году перехода на специальный налоговый
    # режим, либо с начала текущего календарного года превысил 60 миллионов рублей»;
    # ч. 2 ст. 1 — эксперимент проводится до 31 декабря 2027 года включительно, поэтому лимит
    # задан для доходов за 2021–2026 годы (переход и применение в 2022–2027 годах).
    norm: "ч. 2 ст. 3 и ст. 4 Федерального закона № 17-ФЗ от 25.02.2022"
    norm_url: "https://base.garant.ru/403574288/1b93c134b90c6071b4dc3f495464b753/"
    fns_url: "https://ausn.nalog.gov.ru/"
    limits:
      - { income_years: [2021, 2022, 2023, 2024, 2025, 2026], limit_rub: 60000000, verified: true }
    steps:
      - text: "Обычно уведомляют налоговую об утрате права на АУСН через личный кабинет или банк — не позднее 15-го числа месяца, следующего за месяцем превышения."
        norm: "ч. 6 ст. 4 закона № 17-ФЗ"
        verified: true
      - text: "Право обычно теряется с начала месяца, в котором доход превысил лимит, и с этой даты действует общий режим."
        norm: "ч. 6 ст. 4 закона № 17-ФЗ"
        verified: true
      - text: "Чтобы с той же даты перейти на УСН или ЕСХН, обычно подают уведомление о переходе вместе с уведомлением об утрате права."
        norm: "ч. 9 ст. 4 закона № 17-ФЗ"
        verified: true
      - text: "Условие для перехода на АУСН — доход за прошлый год и с начала года не выше лимита."
        norm: "п. 23 ч. 2 ст. 3 закона № 17-ФЗ"
        verified: true
