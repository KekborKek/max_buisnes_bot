  /api/calendar/rebuild:
    post:
      tags:
      - miniapp
      summary: Пересобрать календарь по профилю (экран 19, идемпотентно)
      description: Отметки, свои задачи, часовой пояс и настройки уведомлений не сбрасываются.
        Повторный вызов дублей не создаёт. Пишет событие calendar_built с rebuild.
      operationId: rebuild_calendar_api_calendar_rebuild_post
      parameters:
      - name: x-max-init-data
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
            Бэкенд проверяет подпись токеном бота и берёт из них пользователя. Без
            заголовка или с неверной подписью — 401.
          title: X-Max-Init-Data
        description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
          Бэкенд проверяет подпись токеном бота и берёт из них пользователя. Без заголовка
          или с неверной подписью — 401.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildResponse'
        '409':
          description: 'Профиль не заполнен: календарь не из чего собрать (profile_incomplete)'
        '503':
          description: 'Справочник недоступен: файл не загрузился или в нём нет нужного
            года (reference_unavailable)'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Нет заголовка X-Max-Init-Data или неверная подпись initData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/profile/settings:
    put:
      tags:
      - miniapp
      summary: Сохранить настройки напоминаний (экран 13) и пересчитать уведомления
      description: Все поля обязательны; d1 не передаётся — он всегда включён. Незнакомые
        ключи Profile.reminders сохраняются. После смены d30, d7, часа или пояса все
        pending-уведомления пересчитываются одной транзакцией. Повтор того же тела
        ничего не меняет. Событие reminder_settings_changed {changed} — только если
        что-то изменилось.
      operationId: save_settings_api_profile_settings_put
      parameters:
      - name: x-max-init-data
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
            Бэкенд проверяет подпись токеном бота и берёт из них пользователя. Без
            заголовка или с неверной подписью — 401.
          title: X-Max-Init-Data
        description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
          Бэкенд проверяет подпись токеном бота и берёт из них пользователя. Без заголовка
          или с неверной подписью — 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileSettingsInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
        '409':
          description: 'Профиль не заполнен: онбординг не пройден (profile_incomplete)'
        '503':
          description: 'Справочник недоступен, а изменение требует пересчёта уведомлений
            (d30, d7, час или пояс): настройки не сохранены (reference_unavailable).
            Изменение только digest справочника не требует — ответ 200'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Нет заголовка X-Max-Init-Data или неверная подпись initData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/shares:
    post:
      tags:
      - miniapp
      summary: Создать приглашение по своему событию
      description: 'Повторный вызов по тому же событию с теми же названием и датой
        — тот же код.


        Мини-апп зовёт его при открытии карточки (ссылка должна быть готова к нажатию:
        MAX Bridge

        проверяет клик пользователя), поэтому `share_created` пишет мини-апп по нажатию,
        а не здесь.'
      operationId: create_share_api_shares_post
      parameters:
      - name: x-max-init-data
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
