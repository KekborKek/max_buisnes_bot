          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/shares/{code}/accept:
    post:
      tags:
      - miniapp
      summary: Добавить срок из приглашения себе (идемпотентно)
      description: 'Профиль не нужен: получатель может быть новым пользователем (экран
        18).


        Повторное принятие тем же пользователем отдаёт ту же задачу (`created: false`).
        Если ту

        задачу он удалил — создаётся новая.'
      operationId: accept_share_api_shares__code__accept_post
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: x-max-init-data
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
            Бэкенд проверяет подпись токеном бота и берёт из них пользователя. Без
