openapi: 3.1.0
info:
  title: MAX Business Bot API
  description: API мини-приложения «Календарь обязательств ИП» для MAX. Авторизация
    — заголовок `X-Max-Init-Data` с подписанными данными запуска MAX Bridge; логинов
    и паролей нет. Обязательные проверки — DATA-API.yaml в корне репозитория.
  version: 0.1.0
servers:
- url: https://vse-uspel.ru
  description: Прод (адрес из DATA-API.yaml)
paths:
  /api/calendar:
    get:
      tags:
      - miniapp
      summary: События за период и все просроченные без отметки
      operationId: get_calendar_api_calendar_get
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
          description: YYYY-MM-DD, включительно
          title: From
        description: YYYY-MM-DD, включительно
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
          description: YYYY-MM-DD, включительно
          title: To
        description: YYYY-MM-DD, включительно
      - name: x-max-init-data
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
            Бэкенд проверяет подпись токеном бота и берёт из них пользователя. Без
            заголовка или с неверной подписью — 401.
          title: X-Max-Init-Data
        description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
          Бэкенд проверяет подпись токеном бота и берёт из них пользователя. Без заголовка
          или с неверной подписью — 401.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarItem'
                title: Response Get Calendar Api Calendar Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Нет заголовка X-Max-Init-Data или неверная подпись initData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/items/{item_type}/{item_id}:
    get:
      tags:
      - miniapp
      summary: Карточка события
      operationId: get_item_api_items__item_type___item_id__get
      parameters:
      - name: item_type
        in: path
        required: true
        schema:
          enum:
          - obligation
          - task
          type: string
          title: Item Type
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      - name: x-max-init-data
