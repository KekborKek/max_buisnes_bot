          title: X-Max-Init-Data
        description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
          Бэкенд проверяет подпись токеном бота и берёт из них пользователя. Без заголовка
          или с неверной подписью — 401.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCard'
        '404':
          description: Нет такого события у пользователя
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Нет заголовка X-Max-Init-Data или неверная подпись initData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
    delete:
      tags:
      - miniapp
      summary: Снять отметку (идемпотентно)
      operationId: unmark_done_api_items__item_type___item_id__done_delete
      parameters:
      - name: item_type
        in: path
        required: true
        schema:
          enum:
          - obligation
          - task
          type: string
          title: Item Type
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      - name: x-max-init-data
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
            Бэкенд проверяет подпись токеном бота и берёт из них пользователя. Без
            заголовка или с неверной подписью — 401.
          title: X-Max-Init-Data
        description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
          Бэкенд проверяет подпись токеном бота и берёт из них пользователя. Без заголовка
          или с неверной подписью — 401.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCard'
        '404':
          description: Нет такого события у пользователя
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Нет заголовка X-Max-Init-Data или неверная подпись initData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/obligations/{item_id}/report:
