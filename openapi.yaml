  /health:
    get:
      tags:
      - service
      summary: Проверка, что сервис жив
      description: 'БД проверяем настоящим запросом, а не константами (issue #21):
        Docker HEALTHCHECK

        ходит именно сюда, и без этой проверки контейнер с мёртвой базой считается
        здоровым.


        `token_configured` — только факт наличия MAX_BOT_TOKEN (true/false); сам токен
        и любые

        секреты в ответ не попадают (правило 3 AGENTS.md). Эндпоинт публичный.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
        '503':
          description: База данных не отвечает (status и db — error)
components:
