        description: Подписанные данные запуска мини-приложения из MAX Bridge (`window.WebApp.initData`).
          Бэкенд проверяет подпись токеном бота и берёт из них пользователя. Без заголовка
          или с неверной подписью — 401.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCard'
        '404':
          description: Нет такого события у пользователя
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Нет заголовка X-Max-Init-Data или неверная подпись initData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
