server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API проксируем на бэкенд, чтобы мини-апп и API были на одном домене (без CORS)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Вебхук MAX: без этого локально через порт мини-аппа он недоступен вообще
  location /webhook/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Панель с API и схема. Иначе их проглатывает SPA-фолбэк ниже и отдаёт мини-апп с кодом 200
  location /docs {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /openapi.json {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
