server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Маршруты бэкенда объявлены точечно: всё, что не перечислено здесь, уходит
  # в SPA-фолбэк ниже и возвращает HTML мини-аппа с кодом 200 — поломка,
  # которую не видно по коду ответа.

  # API проксируем на бэкенд, чтобы мини-апп и API были на одном домене (без CORS)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Вебхук MAX: без этого через порт мини-аппа он недоступен вообще
  location /webhook/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Панель с API, схема, ReDoc и health — точные пути, подпутей у них нет
  location = /docs {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /openapi.json {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /redoc {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
