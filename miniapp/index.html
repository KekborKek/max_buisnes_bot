<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MAX Business</title>
    <!-- MAX Bridge: создаёт window.WebApp (docs: dev.max.ru/docs/webapps/bridge) -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <!--
      Тема оформления (FRONT-20): красим html до первого рендера, чтобы не мигнуть чужой темой
      (React ещё не запустился — MaxUI и ThemeProvider из src/shell/Theme.tsx применятся позже).
      Логика — та же, что в Theme.tsx (ключ localStorage, приоритет явного выбора над системной
      темой), продублирована намеренно: этот код обязан отработать раньше любого бандла.
      Полностью в try/catch — localStorage/matchMedia могут быть недоступны.
    -->
    <script>
      try {
        var stored = localStorage.getItem("profile.theme");
        var scheme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = scheme;
        document.documentElement.style.colorScheme = scheme;
      } catch (e) {
        /* тема останется дефолтной (светлой) — не мигание, а меньшее зло без localStorage/matchMedia */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
